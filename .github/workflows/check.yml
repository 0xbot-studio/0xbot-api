name: API checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oxbot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: oxbot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U oxbot" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://oxbot:test-only-password@localhost:5432/oxbot_test?sslmode=disable
      - run: go build ./...

